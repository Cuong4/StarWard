<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090E" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>Starward — Chiến Trường Tinh Hà (PC Edition)</title>
    <meta name="description" content="Game bắn phi thuyền Roguelite Arcade 2D tốc độ cao cho PC với 10 Chiến Cơ, hiệu ứng Lướt độc nhất, 8 chiến khu biến đổi và đấu Boss." />
    <meta property="og:title" content="Starward — Chiến Trường Tinh Hà (PC Edition)" />
    <meta property="og:description" content="Game bắn phi thuyền Roguelite Arcade 2D tốc độ cao cho PC với 10 Chiến Cơ, hiệu ứng Lướt độc nhất, 8 chiến khu biến đổi và đấu Boss." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Clear any legacy PWA Service Workers that could cause a blank cached page on GitHub Pages
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
    </script>
  </head>
  <body class="bg-[#07090E] text-slate-100 overflow-hidden select-none antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" onerror="window.__loadGitHubPagesFallback && window.__loadGitHubPagesFallback()"></script>
    <script>
      // Fallback loader when GitHub Pages serves the raw repository root branch directly without Vite build
      window.__loadGitHubPagesFallback = function () {
        if (window.__ghFallbackLoaded) return;
        window.__ghFallbackLoaded = true;
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './public/github-pages-bundle.css';
        document.head.appendChild(link);

        var script = document.createElement('script');
        script.type = 'module';
        script.src = './public/github-pages-bundle.js';
        document.body.appendChild(script);
      };

      // Also check after 600ms on github.io in case MIME type error on .tsx did not trigger script onerror
      if (window.location.hostname.indexOf('github.io') !== -1) {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            window.__loadGitHubPagesFallback();
          }
        }, 450);
      }
    </script>
  </body>
</html>
